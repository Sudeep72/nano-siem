[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-siem"
version = "5.0.0"
description = "A production-grade, minimal-dependency SIEM engine with Sigma detection, ATT&CK coverage reporting, rule validation, attack chain correlation, ML anomaly scoring, STIX 2.1 export, SOC dashboard, and AI-powered incident reasoning"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Sudeep Ravichandran", email = "sudeep7217@gmail.com" }
]
keywords = [
    "siem", "security", "sigma", "detection-engineering", "soc",
    "anomaly-detection", "stix", "threat-detection", "cybersecurity",
    "mitre-attack", "ai-security"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "stix2>=3.0",
    "scikit-learn>=1.3",
    "typer>=0.9",
    "rich>=13.0",
    "joblib>=1.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.scripts]
nano-siem = "nano_siem.cli.app:app"

[project.urls]
Homepage = "https://github.com/Sudeep72/nano-siem"
Repository = "https://github.com/Sudeep72/nano-siem"
"Bug Tracker" = "https://github.com/Sudeep72/nano-siem/issues"
Changelog = "https://github.com/Sudeep72/nano-siem/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/Sudeep72/nano-siem/blob/main/ROADMAP.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["nano_siem*"]
exclude = ["data*", "rules*", "alerts*", "dashboard*", "tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
nano_siem = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "N806"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
