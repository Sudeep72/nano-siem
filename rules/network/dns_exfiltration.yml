title: Potential DNS Exfiltration
id: b2c4e6f8-1234-4abc-8def-000000000031
status: experimental
description: >
  Detects DNS queries with unusually long subdomains or high-entropy names,
  which may indicate data exfiltration over DNS. Attackers encode data in
  DNS subdomain labels to bypass network controls.
author: NanoSIEM
date: 2026-06-01
tags:
  - attack.exfiltration
  - attack.command_and_control
  - attack.t1071
logsource:
  product: network
  service: dns
level: medium
detection:
  long_subdomain:
    message|contains:
      - 'query'
    message|re: '[a-zA-Z0-9]{40,}\.'
  condition: long_subdomain
falsepositives:
  - CDN providers with long subdomain names
  - Certificate transparency logs
  - Some legitimate software update mechanisms
