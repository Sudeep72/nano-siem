title: Web Admin Panel Access Attempt
id: a5e1b3c2-1234-4abc-8def-000000000005
status: stable
description: >
  Detects HTTP requests to common admin panel paths. May indicate
  unauthorized access attempts or reconnaissance.
author: nano-siem
date: 2026-06-01
tags:
  - attack.discovery
  - attack.t1083
logsource:
  product: webserver
level: medium
detection:
  url_patterns:
    message|contains:
      - '/admin'
      - '/wp-admin'
      - '/phpmyadmin'
      - '/manager/html'
      - '/.env'
      - '/config.php'
  condition: url_patterns
falsepositives:
  - Legitimate admin users
  - Security scanners
