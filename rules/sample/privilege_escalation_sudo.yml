title: Privilege Escalation via Sudo
id: a5e1b3c2-1234-4abc-8def-000000000003
status: stable
description: >
  Detects sudo usage to execute commands as root, which may indicate
  privilege escalation by a compromised or malicious account.
author: nano-siem
date: 2026-06-01
tags:
  - attack.privilege_escalation
  - attack.t1548.003
logsource:
  product: linux
  service: sudo
level: medium
detection:
  keywords:
    - 'sudo'
  filter:
    message|contains:
      - 'as root'
      - 'COMMAND='
  condition: keywords and filter
falsepositives:
  - Legitimate administrative tasks
