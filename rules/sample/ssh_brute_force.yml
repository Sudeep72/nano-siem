title: SSH Brute Force Attempt
id: a5e1b3c2-1234-4abc-8def-000000000001
status: stable
description: >
  Detects repeated failed SSH authentication attempts from a single source,
  indicative of a brute-force or credential stuffing attack.
author: nano-siem
date: 2026-06-01
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
level: high
detection:
  keywords:
    - 'Failed password'
    - 'Invalid user'
  condition: keywords
falsepositives:
  - Legitimate users mistyping passwords
