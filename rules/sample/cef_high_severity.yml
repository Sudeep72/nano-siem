title: High Severity CEF Event
id: a5e1b3c2-1234-4abc-8def-000000000006
status: stable
description: >
  Fires on any CEF event with severity >= 8, which indicates critical
  or high-severity detections from network security devices (IDS, NGFW, WAF).
author: nano-siem
date: 2026-06-01
tags:
  - attack.impact
logsource:
  product: network
level: high
detection:
  high_sev:
    log_source: 'cef'
  condition: high_sev
falsepositives:
  - Misconfigured severity thresholds on devices
