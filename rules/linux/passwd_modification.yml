title: Password File Modification
id: b2c4e6f8-1234-4abc-8def-000000000012
status: stable
description: >
  Detects modifications to /etc/passwd or /etc/shadow. Direct edits to these
  files outside of standard tools (passwd, useradd) may indicate an attacker
  adding a backdoor account.
author: NanoSIEM
date: 2026-06-01
tags:
  - attack.persistence
  - attack.t1136
logsource:
  product: linux
  service: syslog
level: high
detection:
  passwd_files:
    message|contains:
      - '/etc/passwd'
      - '/etc/shadow'
      - '/etc/sudoers'
  condition: passwd_files
falsepositives:
  - System administrator account management
  - useradd/usermod/userdel operations
