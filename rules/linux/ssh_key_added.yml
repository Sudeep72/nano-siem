title: SSH Authorized Key Added
id: b2c4e6f8-1234-4abc-8def-000000000011
status: stable
description: >
  Detects additions to SSH authorized_keys files. Attackers commonly add
  SSH keys for persistence after gaining initial access.
author: NanoSIEM
date: 2026-06-01
tags:
  - attack.persistence
  - attack.t1098
logsource:
  product: linux
  service: syslog
level: high
detection:
  authorized_keys:
    message|contains:
      - 'authorized_keys'
  write_operation:
    message|contains:
      - 'write'
      - 'added'
      - 'append'
      - 'echo'
  condition: authorized_keys and write_operation
falsepositives:
  - Legitimate user adding their own SSH key
  - Ansible/Puppet/Chef configuration management
